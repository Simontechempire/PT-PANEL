<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>PT Panel Login</title><style>body{margin:0;background:#0a0e14;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#151a23;padding:30px;border-radius:16px;width:90%;max-width:340px;text-align:center;box-shadow:0 0 30px #00d1ff40}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#232a36;color:#fff}button{width:100%;padding:12px;background:#00d1ff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}h1{color:#00d1ff}</style></head><body><div class="box"><h2>🔥 FRANK HOST</h2><h1>PT PANEL</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="m"></p></div><script>async function login(){let u=document.getElementById('u').value,p=document.getElementById('p').value;let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await r.json();if(d.success){localStorage.setItem('user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'/admin.html':'/dashboard.html'}else document.getElementById('m').innerText='Login failed'}</script></body></html>
