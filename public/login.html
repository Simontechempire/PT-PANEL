<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Panel Login</title><style>body{margin:0;background:#080c12;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#131a26;padding:32px;border-radius:18px;width:90%;max-width:360px;text-align:center;box-shadow:0 0 40px #00d1ff30}input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#1f293b;color:#fff}button{width:100%;padding:13px;background:#00d1ff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}small{color:#7a8599}</style></head><body><div class="box"><h2>🔥 FRANK HOST</h2><h1 style="color:#00d1ff">PT PANEL</h1><small>Connected: frankdavid00202.replit.app</small><br><br><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="m" style="color:#ff6b6b"></p></div><script>async function login(){let u=document.getElementById('u').value,p=document.getElementById('p').value;let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await r.json();if(d.success){localStorage.setItem('user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'/admin.html':'/dashboard.html'}else document.getElementById('m').innerText='Invalid login'}</script></body></html>
