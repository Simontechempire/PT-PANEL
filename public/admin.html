<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Panel</title><style>body{margin:0;background:#0a0e14;color:#fff;font-family:Arial}.nav{background:#151a23;padding:15px}.card{background:#151a23;margin:15px;padding:20px;border-radius:12px}.srv{background:#1e2633;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between}button{padding:6px 10px;background:#ff4757;border:none;border-radius:6px;cursor:pointer;color:#fff}</style></head><body><div class="nav"><b>🔥 ADMIN - PT PANEL</b> | <a href="/dashboard.html" style="color:#00d1ff">User View</a></div><div class="card"><h3>All Servers</h3><div id="list"></div></div><div class="card"><h3>All Users</h3><div id="users"></div></div><script>async function load(){let r=await fetch('/api/servers');let s=await r.json();document.getElementById('list').innerHTML=s.map(x=>`<div class=srv><div><b>${x.name}</b> ${x.id}<br><small>${x.owner} | ${x.ram} | ${x.cpu}</small></div><div><button onclick="del('${x.id}')">Delete</button></div></div>`).join('');let ru=await fetch('/api/users');let u=await ru.json();document.getElementById('users').innerHTML=u.map(x=>`${x.username} - ${x.role}<br>`).join('')}async function del(id){await fetch('/api/server/'+id,{method:'DELETE'});load()}load()</script></body></html>
