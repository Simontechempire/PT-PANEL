<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>body{margin:0;background:#080c12;color:#fff;font-family:Arial}.nav{background:#131a26;padding:14px;display:flex;justify-content:space-between}.card{background:#131a26;margin:14px;padding:18px;border-radius:14px}.srv{background:#1e293b;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between}button{padding:6px 10px;background:#ff4757;border:none;border-radius:6px;color:#fff}</style></head><body><div class="nav"><b>🔥 ADMIN PT PANEL</b><span id="vps"></span></div><div class="card"><h3>VPS Node Info</h3><div id="vpsinfo"></div></div><div class="card"><h3>All Servers</h3><div id="list"></div></div><div class="card"><h3>Users</h3><div id="users"></div></div><script>async function load(){let vs=await fetch('/api/vps-status');let vd=await vs.json();document.getElementById('vps').innerHTML=vd.connected?'🟢 VPS Connected':'🔴 VPS Offline';document.getElementById('vpsinfo').innerHTML=`Host: ${vd.host}<br>Status: ${vd.status}<br>CPU: ${vd.vps_data?.cpu||'N/A'}<br>RAM: ${vd.vps_data?.ram||'N/A'}`;let r=await fetch('/api/servers');let s=await r.json();document.getElementById('list').innerHTML=s.map(x=>`<div class=srv><div><b>${x.name}</b> ${x.id}<br><small>${x.owner} | ${x.ram} | ${x.vps_ip||''}:${x.vps_port||''}</small></div><div><button onclick="del('${x.id}')">Delete</button></div></div>`).join('')||'No servers';let ru=await fetch('/api/users');let u=await ru.json();document.getElementById('users').innerHTML=u.map(x=>`${x.username} [${x.role}]<br>`).join('')}async function del(id){await fetch('/api/server/'+id,{method:'DELETE'});load()}load()</script></body></html>
