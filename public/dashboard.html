<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>body{margin:0;background:#080c12;color:#fff;font-family:Arial}.nav{background:#131a26;padding:14px;display:flex;justify-content:space-between}.card{background:#131a26;margin:14px;padding:18px;border-radius:14px}button{padding:10px 14px;background:#00d1ff;border:none;border-radius:8px;font-weight:bold}input,select{padding:10px;margin:4px;border-radius:8px;border:none;background:#1f293b;color:#fff}.srv{background:#1e293b;padding:12px;margin:8px 0;border-radius:10px}</style></head><body><div class="nav"><b>PT PANEL</b><span id="vps">Checking VPS...</span></div><div class="nav" style="background:#0a0e14"><span id="un"></span><span>USER</span></div><div class="card"><h3>Deploy Server to Your VPS</h3><input id="n" placeholder="Server Name e.g Survival"><select id="r"><option>1GB RAM</option><option>2GB RAM</option><option>4GB RAM</option><option>8GB RAM</option></select><select id="c"><option>50% CPU</option><option>100% CPU</option><option>200% CPU</option></select><button onclick="createS()">+ DEPLOY TO VPS</button></div><div class="card"><h3>My VPS Servers</h3><div id="list">Loading...</div></div><script>let user=JSON.parse(localStorage.getItem('user')||'{}');document.getElementById('un').innerText=user.username;async function checkVPS(){let r=await fetch('/api/vps-status');let d=await r.json();document.getElementById('vps').innerHTML=d.connected?`🟢 VPS Online`:`🔴 VPS Offline`}async function createS(){let name=document.getElementById('n').value,ram=document.getElementById('r').value,cpu=document.getElementById('c').value;await fetch('/api/create-server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,ram,cpu,owner:user.username})});load()}async function load(){let r=await fetch('/api/servers');let s=await r.json();document.getElementById('list').innerHTML=s.filter(x=>x.owner===user.username).map(x=>`<div class=srv><b>${x.name}</b> (${x.id})<br>${x.ram} | ${x.cpu}<br>Node: ${x.vps}<br>IP: ${x.vps_ip||'...'}:${x.vps_port||''}<br>Status: <b style=color:#0f0>${x.status}</b></div>`).join('')||'No servers'}checkVPS();load()</script></body></html>
