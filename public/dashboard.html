<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><style>body{margin:0;background:#0a0e14;color:#fff;font-family:Arial}.nav{background:#151a23;padding:15px;display:flex;justify-content:space-between}.card{background:#151a23;margin:15px;padding:20px;border-radius:12px}button{padding:10px;background:#00d1ff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}input,select{padding:10px;margin:5px;border-radius:8px;border:none;background:#232a36;color:#fff}.srv{background:#1e2633;padding:10px;margin:8px 0;border-radius:8px}</style></head><body><div class="nav"><b>PT PANEL</b><span id="un"></span></div><div class="card"><h3>Create Server</h3><input id="n" placeholder="Server Name"><select id="r"><option>1GB</option><option>2GB</option><option>4GB</option><option>8GB</option></select><select id="c"><option>50%</option><option>100%</option><option>200%</option></select><button onclick="createS()">+ CREATE</button></div><div class="card"><h3>My Servers</h3><div id="list"></div></div><script>let user=JSON.parse(localStorage.getItem('user')||'{}');document.getElementById('un').innerText=user.username;async function createS(){let name=document.getElementById('n').value,ram=document.getElementById('r').value,cpu=document.getElementById('c').value;await fetch('/api/create-server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,ram,cpu,owner:user.username})});load()}async function load(){let r=await fetch('/api/servers');let s=await r.json();document.getElementById('list').innerHTML=s.filter(x=>x.owner===user.username).map(x=>`<div class=srv><b>${x.name}</b> (${x.id})<br>${x.ram} | ${x.cpu} | <span style=color:#0f0>${x.status}</span></div>`).join('')||'No servers'}load()</script></body></html>
